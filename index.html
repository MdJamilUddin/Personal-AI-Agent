<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5502f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Admin Agent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Personal Admin Agent · AI</title>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  window.FirebaseSDK = {
    initializeApp, getAuth, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, signOut, onAuthStateChanged,
    getFirestore, doc, setDoc, getDoc, onSnapshot
  };
  window.dispatchEvent(new Event("firebase-sdk-ready"));
</script>

<style>
:root{
  --bg:#f5f4f0; --bg2:#eceae3; --card:#ffffff; --ink:#1a1916; --sub:#6f6e67;
  --line:#e2e0d8; --accent:#b5502f; --accent-soft:#f4e6e0;
  --ok:#2f6b52; --ok-soft:#e2efe8; --warn:#c98a2f; --warn-soft:#f8efdc;
  --danger:#c0392b; --danger-soft:#fae2e0; --gold:#c9a961; --gold-soft:#f8f0dc;
  --cloud:#4285f4; --cloud-soft:#e3f0ff;
  --shadow-sm:0 1px 2px rgba(20,18,12,.04);
  --shadow-md:0 4px 14px rgba(20,18,12,.06);
  --shadow-lg:0 12px 40px rgba(20,18,12,.12);
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --ease:cubic-bezier(.4,0,.2,1);
  --font-bn:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#14130f; --bg2:#1c1a15; --card:#211f1a; --ink:#f2efe7; --sub:#a5a297;
  --line:#332f26; --accent:#d8734c; --accent-soft:#2a1d17;
  --ok:#5fa585; --ok-soft:#1a2a22; --warn:#e0b06a; --warn-soft:#2a2317;
  --danger:#e57366; --danger-soft:#2a1a18; --gold:#e0c089; --gold-soft:#2a2417;
  --cloud:#6ba0f5; --cloud-soft:#1a2436;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
[data-theme="ocean"]{--bg:#eef5f8;--bg2:#dce9ef;--card:#fff;--ink:#0f2b38;--sub:#527a8a;--line:#c9dbe4;--accent:#0d7ea3;--accent-soft:#d8eef6;--ok:#0f7a5c;--ok-soft:#d8f0e6;}
[data-theme="forest"]{--bg:#eef3ea;--bg2:#dfe9d8;--card:#fff;--ink:#1a2e18;--sub:#5a6e54;--line:#cfdcc6;--accent:#3a7d44;--accent-soft:#dbeedb;}
[data-theme="sunset"]{--bg:#fbf1ec;--bg2:#f4e0d6;--card:#fff;--ink:#2d1a12;--sub:#8a6b5d;--line:#eed4c6;--accent:#d6502f;--accent-soft:#fbe2da;}
[data-theme="purple"]{--bg:#f4f0fa;--bg2:#e8e0f2;--card:#fff;--ink:#241a33;--sub:#665e7a;--line:#dbd0e8;--accent:#7c3aed;--accent-soft:#ece0ff;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-bn),-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .25s var(--ease),color .25s var(--ease);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font:inherit;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.app{display:grid;grid-template-columns:1fr;min-height:100vh;max-width:1500px;margin:0 auto;}
@media(min-width:900px){.app{grid-template-columns:260px 1fr;}}
.sidebar{background:var(--bg2);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;}
@media(max-width:899px){.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .3s var(--ease);z-index:100;box-shadow:var(--shadow-lg);padding-top:calc(20px + env(safe-area-inset-top));}.sidebar.open{transform:translateX(0);}}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;opacity:0;transition:opacity .3s var(--ease);}
.sidebar-backdrop.show{display:block;opacity:1;}
@media(min-width:900px){.sidebar-backdrop{display:none!important;}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.brand-logo{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#d8734c);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(181,80,47,.3);}
.brand-text b{display:block;font-size:.95rem;}
.brand-text span{display:block;font-size:.68rem;color:var(--sub);}
.nav-section{padding:14px 0 4px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700;padding-left:10px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--sub);font-size:.86rem;font-weight:500;cursor:pointer;transition:all .15s var(--ease);width:100%;text-align:left;}
.nav-item:hover{background:var(--card);color:var(--ink);}
.nav-item.active{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);}
.nav-item .icon{width:18px;text-align:center;font-size:1rem;}
.nav-item .count{margin-left:auto;font-size:.65rem;background:var(--accent);color:#fff;padding:1px 7px;border-radius:20px;font-weight:700;display:none;}
.main{padding:20px;min-width:0;}
@media(max-width:899px){.main{padding:14px;}}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:1.2rem;place-items:center;}
@media(max-width:899px){.menu-btn{display:grid;}}
.page-title{flex:1;min-width:0;}
.page-title h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;}
.page-title p{margin:2px 0 0;color:var(--sub);font-size:.85rem;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.icon-round{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:1rem;transition:all .15s var(--ease);box-shadow:var(--shadow-sm);}
.icon-round:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
.icon-round.active{background:var(--ok);color:#fff;border-color:var(--ok);}
.icon-round.cloud-active{background:var(--cloud);color:#fff;border-color:var(--cloud);}
.discipline-card{background:linear-gradient(135deg,var(--accent),#d8734c);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(181,80,47,.3);position:relative;overflow:hidden;}
.discipline-card::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);}
.discipline-card .dc-head{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.discipline-card .dc-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.9;font-weight:600;}
.discipline-card .dc-score{font-size:2.6rem;font-weight:800;line-height:1;margin:8px 0 4px;letter-spacing:-.03em;}
.discipline-card .dc-level{font-size:.82rem;opacity:.95;}
.discipline-card .dc-ring{width:60px;height:60px;border-radius:50%;background:conic-gradient(rgba(255,255,255,.4) 0%,rgba(255,255,255,.15) var(--p,0%),transparent 0%);display:grid;place-items:center;font-size:1.4rem;position:relative;}
.discipline-card .dc-ring::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--accent);}
.discipline-card .dc-ring span{position:relative;z-index:1;}
.section-title{font-size:1.05rem;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.btn-primary{padding:11px 20px;background:var(--accent);color:#fff;border-radius:var(--radius-sm);font-weight:600;font-size:.88rem;transition:all .15s var(--ease);box-shadow:0 4px 12px rgba(181,80,47,.25);display:inline-flex;align-items:center;gap:6px;justify-content:center;cursor:pointer;border:none;}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn-secondary{padding:10px 18px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--line);font-weight:500;font-size:.86rem;transition:all .15s var(--ease);}
.btn-secondary:hover{background:var(--bg2);}
.btn-ghost{padding:8px 14px;border-radius:var(--radius-sm);background:transparent;color:var(--sub);font-size:.82rem;font-weight:500;}
.btn-ghost:hover{background:var(--bg2);color:var(--ink);}
.btn-danger{background:var(--danger);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.86rem;}
.btn-ok{background:var(--ok);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.86rem;}
.btn-cloud{background:var(--cloud);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.card h3{margin:0 0 12px;font-size:.95rem;font-weight:600;}
.stats{display:grid;gap:12px;margin-bottom:20px;grid-template-columns:repeat(2,1fr);}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr);}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);}
.stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:600;}
.stat .value{font-size:1.5rem;font-weight:700;margin-top:4px;letter-spacing:-.02em;line-height:1.1;}
.stat .delta{font-size:.7rem;color:var(--sub);margin-top:2px;}
.stat.high .value{color:var(--accent);}
.stat.ok .value{color:var(--ok);}
.stat.gold .value{color:var(--gold);}
.template-grid{display:grid;gap:12px;grid-template-columns:1fr;}
@media(min-width:600px){.template-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1000px){.template-grid{grid-template-columns:repeat(3,1fr);}}
.template-card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s var(--ease);}
.template-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-md);}
.template-card .tc-emoji{font-size:2rem;margin-bottom:8px;}
.template-card .tc-name{font-weight:700;font-size:1rem;margin-bottom:4px;}
.template-card .tc-desc{font-size:.78rem;color:var(--sub);line-height:1.4;}
.template-card .tc-count{font-size:.7rem;color:var(--accent);font-weight:600;margin-top:8px;}
.routine-grid{display:grid;gap:12px;grid-template-columns:1fr;}
@media(min-width:600px){.routine-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1000px){.routine-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:1300px){.routine-grid{grid-template-columns:repeat(7,1fr);}}
.day-card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;min-height:180px;}
.day-card.today{border-color:var(--accent);box-shadow:0 4px 16px rgba(181,80,47,.15);}
.day-card.today .day-name{color:var(--accent);}
.day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.day-name{font-weight:700;font-size:.9rem;}
.day-date{font-size:.68rem;color:var(--sub);}
.day-body{flex:1;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.routine-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:.76rem;display:flex;align-items:center;gap:8px;transition:all .15s var(--ease);}
.routine-item:hover{border-color:var(--accent);transform:translateX(2px);}
.routine-item .time{font-weight:700;color:var(--accent);font-size:.68rem;background:var(--accent-soft);padding:1px 6px;border-radius:6px;flex-shrink:0;}
.routine-item .r-text{flex:1;line-height:1.25;word-break:break-word;}
.routine-item .r-del,.routine-item .r-cal,.routine-item .r-mail{color:var(--sub);font-size:.7rem;padding:2px 5px;border-radius:5px;opacity:0;transition:all .15s var(--ease);cursor:pointer;}
.routine-item:hover .r-del,.routine-item:hover .r-cal,.routine-item:hover .r-mail{opacity:1;}
.routine-item .r-del:hover{background:var(--danger);color:#fff;}
.routine-item .r-cal{color:var(--ok);}
.routine-item .r-cal:hover{background:var(--ok);color:#fff;}
.routine-item .r-mail{color:var(--accent);}
.routine-item .r-mail:hover{background:var(--accent);color:#fff;}
.day-add{width:100%;padding:8px;border-radius:8px;background:var(--bg);border:1px dashed var(--line);color:var(--sub);font-size:.76rem;font-weight:500;transition:all .15s var(--ease);cursor:pointer;}
.day-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.day-mail{width:100%;padding:6px;margin-bottom:6px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--sub);font-size:.72rem;font-weight:500;cursor:pointer;transition:all .15s var(--ease);}
.day-mail:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.board{display:grid;gap:14px;grid-template-columns:1fr;}
@media(min-width:700px){.board{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1100px){.board{grid-template-columns:repeat(4,1fr);}}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);min-height:100px;}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px;}
.col-head h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:600;margin:0;display:flex;align-items:center;gap:8px;}
.col-head .count{background:var(--bg2);padding:2px 9px;border-radius:20px;font-weight:600;font-size:.68rem;color:var(--sub);}
.col-head .dot-cat{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.task{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:8px;font-size:.86rem;transition:all .15s var(--ease);}
.task:hover{border-color:var(--accent);}
.task .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.task .top .text{word-break:break-word;flex:1;}
.task .top .remove{color:var(--sub);font-size:.82rem;padding:2px 6px;border-radius:6px;opacity:0;transition:all .15s var(--ease);cursor:pointer;}
.task:hover .top .remove{opacity:1;}
.task .meta{color:var(--sub);font-size:.68rem;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.task .tag{padding:2px 8px;border-radius:20px;font-size:.62rem;font-weight:600;}
.task .tag.high{background:var(--accent-soft);color:var(--accent);}
.task .tag.medium{background:var(--warn-soft);color:var(--warn);}
.task .tag.low{background:var(--bg2);color:var(--sub);}
.empty{color:var(--sub);font-size:.78rem;padding:14px 8px;text-align:center;font-style:italic;border:1px dashed var(--line);border-radius:var(--radius-sm);}
.analytics-grid{display:grid;gap:12px;grid-template-columns:1fr;}
@media(min-width:600px){.analytics-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1000px){.analytics-grid{grid-template-columns:repeat(3,1fr);}}
.analytics-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);}
.analytics-card h4{margin:0 0 12px;font-size:.9rem;font-weight:600;color:var(--sub);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.78rem;}
.bar-row .br-label{width:80px;flex-shrink:0;color:var(--sub);}
.bar-row .br-bar-wrap{flex:1;height:16px;background:var(--bg);border-radius:8px;overflow:hidden;}
.bar-row .br-bar{height:100%;background:linear-gradient(90deg,var(--accent),#d8734c);border-radius:8px;transition:width .5s var(--ease);}
.bar-row .br-value{width:44px;text-align:right;font-weight:600;color:var(--ink);}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.heat-cell{aspect-ratio:1;border-radius:3px;background:var(--bg);}
.heat-cell[data-level="1"]{background:var(--accent-soft);}
.heat-cell[data-level="2"]{background:rgba(181,80,47,.4);}
.heat-cell[data-level="3"]{background:rgba(181,80,47,.7);}
.heat-cell[data-level="4"]{background:var(--accent);}
.streak-big{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent);}
.streak-label{font-size:.78rem;color:var(--sub);margin-top:6px;}
.insight{background:linear-gradient(135deg,var(--accent-soft),var(--card));border:1px solid var(--accent);border-radius:var(--radius);padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;}
.insight .ic-icon{font-size:1.6rem;flex-shrink:0;}
.insight .ic-body{flex:1;}
.insight .ic-title{font-weight:700;font-size:.88rem;margin-bottom:4px;}
.insight .ic-text{font-size:.8rem;color:var(--sub);line-height:1.5;}
.forecast-list{display:flex;flex-direction:column;gap:8px;}
.forecast-day{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:.82rem;}
.forecast-day .fd-name{width:70px;font-weight:600;flex-shrink:0;}
.forecast-day .fd-items{flex:1;color:var(--sub);font-size:.76rem;}
.forecast-day .fd-load{font-size:.7rem;padding:2px 8px;border-radius:20px;font-weight:600;}
.fd-load.light{background:var(--ok-soft);color:var(--ok);}
.fd-load.normal{background:var(--warn-soft);color:var(--warn);}
.fd-load.heavy{background:var(--accent-soft);color:var(--accent);}
.theme-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;}
.theme-swatch{aspect-ratio:1;border-radius:12px;border:3px solid var(--line);cursor:pointer;transition:all .15s var(--ease);display:flex;align-items:flex-end;justify-content:center;padding:8px;color:#fff;font-size:.7rem;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.4);}
.theme-swatch:hover{transform:scale(1.05);}
.theme-swatch.active{border-color:var(--ink);transform:scale(1.02);}
.theme-swatch[data-t="light"]{background:linear-gradient(135deg,#ffffff 50%,#f5f4f0 50%);color:#1a1916;text-shadow:none;}
.theme-swatch[data-t="dark"]{background:linear-gradient(135deg,#211f1a,#14130f);}
.theme-swatch[data-t="ocean"]{background:linear-gradient(135deg,#0d7ea3,#dce9ef);}
.theme-swatch[data-t="forest"]{background:linear-gradient(135deg,#3a7d44,#dfe9d8);}
.theme-swatch[data-t="sunset"]{background:linear-gradient(135deg,#d6502f,#f4e0d6);}
.theme-swatch[data-t="purple"]{background:linear-gradient(135deg,#7c3aed,#e8e0f2);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:.72rem;font-weight:600;margin-bottom:6px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg);outline:none;transition:all .15s var(--ease);font-size:.88rem;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px var(--accent-soft);}
.field-row{display:grid;gap:10px;grid-template-columns:1fr;}
@media(min-width:600px){.field-row{grid-template-columns:1fr 1fr;}}
.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;font-size:.86rem;}
.check-row input{width:auto;}
.toast-container{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none;}

<script>
/* =========================================================
   PERSONAL ADMIN AGENT · AI v8
   All features + Smart Reminders + Weekly Summary +
   Email Reports + Firebase Cloud Sync
   ========================================================= */

const KEYS = {
  routine:"aa_routine_v8", tasks:"aa_tasks_v8", settings:"aa_settings_v8",
  theme:"aa_theme_v8", history:"aa_history_v8", insights:"aa_insights_v8",
  checkins:"aa_checkins_v8", welcome:"aa_welcome_v8",
  habits:"aa_habits_v8", habitLog:"aa_habit_log_v8",
  shareCodes:"aa_share_codes_v8", shareHistory:"aa_share_history_v8",
  sleep:"aa_sleep_v8", water:"aa_water_v8", journal:"aa_journal_v8",
  customSound:"aa_custom_sound_v8",
  smartReminders:"aa_smart_reminders_v8",
  emailRecipients:"aa_email_recipients_v8",
  weeklySummaries:"aa_weekly_summaries_v8",
  firebaseConfig:"aa_firebase_config_v8",
  syncEnabled:"aa_sync_enabled_v8",
  lastSync:"aa_last_sync_v8"
};

const DAYS = ["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
const DAYS_SHORT = ["রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র","শনি"];
const COLS = ["Today","This Week","Waiting","Study","Family","Money","Later"];
const ICS_DAY = ["SU","MO","TU","WE","TH","FR","SA"];

let routine = {}, tasks = [], history = {}, checkins = {}, habits = [], habitLog = {};
let sleepLog = {}, waterLog = {}, journalEntries = [], customSoundData = null;
let smartReminders = [], emailRecipients = [], weeklySummaries = [];
let settings = { sound:true, voice:true, notif:true, volume:0.7,
  sleepEnabled:false, sleepStart:"23:00", sleepEnd:"06:00",
  checkinEnabled:true, welcomeEnabled:true, autoSkipMinutes:2,
  voiceRate:0.95, voicePitch:1.0 };
let insights = [];
let currentView = "dashboard";
let audioCtx = null, activeCheckin = null, checkinTimer = null;
let snoozeUntil = {}, lastFired = {}, welcomeShown = "";
let customAudioEl = null;

/* Firebase State */
let fbApp = null, fbAuth = null, fbDb = null, fbUser = null, fbUnsubscribe = null;
let syncEnabled = false, lastSyncTime = 0, syncing = false, firebaseConfig = null;
let cloudSyncTimer = null;

/* =========================================================
   STORAGE
   ========================================================= */
function loadState(){
  try{ routine = JSON.parse(localStorage.getItem(KEYS.routine)) || {}; }catch(e){ routine = {}; }
  try{ tasks = JSON.parse(localStorage.getItem(KEYS.tasks)) || []; }catch(e){ tasks = []; }
  try{ settings = Object.assign(settings, JSON.parse(localStorage.getItem(KEYS.settings)) || {}); }catch(e){}
  try{ history = JSON.parse(localStorage.getItem(KEYS.history)) || {}; }catch(e){ history = {}; }
  try{ checkins = JSON.parse(localStorage.getItem(KEYS.checkins)) || {}; }catch(e){ checkins = {}; }
  try{ insights = JSON.parse(localStorage.getItem(KEYS.insights)) || []; }catch(e){ insights = []; }
  try{ habits = JSON.parse(localStorage.getItem(KEYS.habits)) || []; }catch(e){ habits = []; }
  try{ habitLog = JSON.parse(localStorage.getItem(KEYS.habitLog)) || {}; }catch(e){ habitLog = {}; }
  try{ sleepLog = JSON.parse(localStorage.getItem(KEYS.sleep)) || {}; }catch(e){ sleepLog = {}; }
  try{ waterLog = JSON.parse(localStorage.getItem(KEYS.water)) || {}; }catch(e){ waterLog = {}; }
  try{ journalEntries = JSON.parse(localStorage.getItem(KEYS.journal)) || []; }catch(e){ journalEntries = []; }
  try{ customSoundData = JSON.parse(localStorage.getItem(KEYS.customSound)) || null; }catch(e){ customSoundData = null; }
  try{ smartReminders = JSON.parse(localStorage.getItem(KEYS.smartReminders)) || []; }catch(e){ smartReminders = []; }
  try{ emailRecipients = JSON.parse(localStorage.getItem(KEYS.emailRecipients)) || []; }catch(e){ emailRecipients = []; }
  try{ weeklySummaries = JSON.parse(localStorage.getItem(KEYS.weeklySummaries)) || []; }catch(e){ weeklySummaries = []; }
  try{ firebaseConfig = JSON.parse(localStorage.getItem(KEYS.firebaseConfig)) || null; }catch(e){ firebaseConfig = null; }
  try{ syncEnabled = localStorage.getItem(KEYS.syncEnabled) === "true"; }catch(e){ syncEnabled = false; }
  try{ lastSyncTime = parseInt(localStorage.getItem(KEYS.lastSync)) || 0; }catch(e){ lastSyncTime = 0; }
  welcomeShown = localStorage.getItem(KEYS.welcome) || "";
}

function saveRoutine(){ try{localStorage.setItem(KEYS.routine,JSON.stringify(routine));}catch(e){} scheduleCloudSync(); }
function saveTasks(){ try{localStorage.setItem(KEYS.tasks,JSON.stringify(tasks));}catch(e){} scheduleCloudSync(); }

function pad2(n){ return String(n).padStart(2,"0"); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function $(id){ return document.getElementById(id); }

function toast(msg,type="info",icon){
  const el = document.createElement("div");
  el.className = "toast" + (type==="ok"?" ok":type==="err"?" err":type==="gold"?" gold":type==="cloud"?" cloud":"");
  el.innerHTML = `<span style="font-size:1.1rem;">${icon || (type==="ok"?"✅":type==="err"?"⚠️":type==="gold"?"🏆":type==="cloud"?"☁️":"ℹ️")}</span><span>${escapeHtml(msg)}</span>`;
  $("toastContainer").appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),300); }, 3500);
}
function closeModal(){ $("modalBackdrop").classList.remove("show"); }
window.closeModal = closeModal;

/* CLIPBOARD */
function copyToClipboard(text, successMsg = "কপি হয়েছে"){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(() => toast(successMsg,"ok","📋"))
      .catch(() => copyFallback(text,successMsg));
    return;
  }
  copyFallback(text,successMsg);
}
function copyFallback(text, successMsg){
  try{
    const ta = $("hiddenCopyArea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, 99999);
    const ok = document.execCommand("copy");
    ta.value = "";
    ta.blur();
    if(ok){ toast(successMsg,"ok","📋"); return true; }
  }catch(e){}
  showManualCopy(text);

/* AUDIO */
function ensureAudio(){
  if(!audioCtx){
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playBeep(d=0.6,f1=880,f2=660){
  const ctx = ensureAudio(); if(!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(f1,now);
  osc.frequency.exponentialRampToValueAtTime(f2,now+d);
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(settings.volume*0.5,now+0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+d);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now+d+0.05);
}
function playAlertSound(){
  if(!settings.sound) return;
  if(customSoundData && customSoundData.dataUrl){
    try{
      if(customAudioEl) customAudioEl.pause();
      customAudioEl = new Audio(customSoundData.dataUrl);
      customAudioEl.volume = settings.volume;
      customAudioEl.play().catch(() => playDefaultAlert());
      return;
    }catch(e){}
  }
  playDefaultAlert();
}
function playDefaultAlert(){
  playBeep(0.18,880,880);
  setTimeout(()=>playBeep(0.18,880,880),220);
  setTimeout(()=>playBeep(0.45,1200,700),440);
}

function speak(text){
  if(!settings.voice) return;
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const isBn = /[\u0980-\u09FF]/.test(text);
    u.lang = isBn ? "bn-BD" : "en-US";
    u.rate = settings.voiceRate || 0.95;
    u.pitch = settings.voicePitch || 1.0;
    u.volume = settings.volume;
    if(isBn){
      const voices = window.speechSynthesis.getVoices();
      const bnVoice = voices.find(v => v.lang.startsWith("bn"));
      if(bnVoice) u.voice = bnVoice;
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* SLEEP MODE */
function isSleepTime(){
  if(!settings.sleepEnabled) return false;
  const now = new Date();
  const cur = now.getHours()*60+now.getMinutes();
  const [sh,sm] = settings.sleepStart.split(":").map(Number);
  const [eh,em] = settings.sleepEnd.split(":").map(Number);
  const start = sh*60+sm, end = eh*60+em;
  if(start<=end) return cur>=start&&cur<end;
  return cur>=start||cur<end;
}

function initFirebase(){
  if(!firebaseConfig){
    return false;
  }
  if(fbApp) return true;
  try{
    const F = window.FirebaseSDK;
    if(!F){
      console.warn("Firebase SDK not loaded yet");
      return false;
    }
    fbApp = F.initializeApp(firebaseConfig);
    fbAuth = F.getAuth(fbApp);
    fbDb = F.getFirestore(fbApp);
    
    F.onAuthStateChanged(fbAuth, (user) => {
      fbUser = user;
      updateCloudIndicator();
      if(user && syncEnabled){
        startSyncListener();
        setTimeout(() => syncFromCloud(true), 1000);
      } else {
        stopSyncListener();
      }
      if(currentView === "cloud" || currentView === "settings" || currentView === "dashboard"){
        renderView();
      }
    });
    return true;
  }catch(e){
    console.error("Firebase init error:", e);
    return false;
  }
}

function buildSyncPayload(){
  return {
    routine, tasks, settings, history, checkins, habits, habitLog,
    sleepLog, waterLog, journalEntries, smartReminders, emailRecipients, weeklySummaries,
    version: 8,
    updatedAt: Date.now(),
    updatedFrom: navigator.userAgent.slice(0, 100)
  };
}
function applySyncPayload(data){
  if(!data) return;
  if(data.routine) routine = data.routine;
  if(Array.isArray(data.tasks)) tasks = data.tasks;
  if(data.settings) settings = Object.assign(settings, data.settings);
  if(data.history) history = data.history;
  if(data.checkins) checkins = data.checkins;
  if(data.habits) habits = data.habits;
  if(data.habitLog) habitLog = data.habitLog;
  if(data.sleepLog) sleepLog = data.sleepLog;
  if(data.waterLog) waterLog = data.waterLog;
  if(data.journalEntries) journalEntries = data.journalEntries;
  if(data.smartReminders) smartReminders = data.smartReminders;
  if(data.emailRecipients) emailRecipients = data.emailRecipients;
  if(data.weeklySummaries) weeklySummaries = data.weeklySummaries;
  
  // Save without re-triggering cloud sync
  try{localStorage.setItem(KEYS.routine,JSON.stringify(routine));}catch(e){}
  try{localStorage.setItem(KEYS.tasks,JSON.stringify(tasks));}catch(e){}
  try{localStorage.setItem(KEYS.settings,JSON.stringify(settings));}catch(e){}
  try{localStorage.setItem(KEYS.history,JSON.stringify(history));}catch(e){}
  try{localStorage.setItem(KEYS.checkins,JSON.stringify(checkins));}catch(e){}

  try{localStorage.setItem(KEYS.habitLog,JSON.stringify(habitLog));}catch(e){}

async function syncToCloud(silent = false){

async function syncFromCloud(silent = false){
  if(!fbUser || !fbDb || syncing) return;
  syncing = true;
  updateCloudIndicator();
  if(!silent) toast("Cloud থেকে ডেটা আনছে...","cloud","☁️");

    const F = window.FirebaseSDK;

/* =========================================================
   SMART REMINDERS ENGINE
   ========================================================= */
function analyzeSmartReminders(){
  if(!routine || Object.keys(routine).length === 0) return [];
  const suggestions = [];
  const today = new Date();
  const lookbackDays = 14;

  for(let dayIdx = 0; dayIdx < 7; dayIdx++){
    const items = routine[dayIdx] || [];
    items.forEach(item => {
      if(!item.enabled) return;
      let scheduledCount = 0, startedCount = 0, skippedCount = 0, snoozedCount = 0;
      let totalResponseMs = 0, responseSamples = 0;

      for(let i = 0; i < lookbackDays; i++){
        const d = new Date(today); d.setDate(d.getDate() - i);
        if(d.getDay() !== dayIdx) continue;
        const key = d.toISOString().slice(0,10);
        const dc = checkins[key] || {};
        const c = dc[item.id];
        if(!c) continue;
        scheduledCount++;
        if(c.status === "started") startedCount++;
        else if(c.status === "skipped") skippedCount++;
        else if(c.status === "snoozed") snoozedCount++;
        if(c.responseMs){ totalResponseMs += c.responseMs; responseSamples++; }
      }
      if(scheduledCount < 3) return;
      const skipRate = (skippedCount + snoozedCount) / scheduledCount;

      if(skipRate > 0.5){
        const suggestion = suggestTimeShift(item.time);
        const reminderId = "sr_" + item.id;
        const existing = smartReminders.find(r => r.id === reminderId);
        if(!existing || existing.status === "dismissed"){
          const reason = skippedCount >= snoozedCount
            ? `${lookbackDays} দিনে ${skippedCount} বার বাদ`
            : `${lookbackDays} দিনে ${snoozedCount} বার পিছিয়েছেন`;
          const reminder = {
            id: reminderId, routineId: item.id, dayIdx, text: item.text,
            currentTime: item.time, suggestedTime: suggestion, reason,
            skipRate: Math.round(skipRate * 100), status: "pending", createdAt: Date.now()
          };
          const idx = smartReminders.findIndex(r => r.id === reminderId);
          if(idx >= 0) smartReminders[idx] = reminder;
          else smartReminders.push(reminder);
          suggestions.push(reminder);
        }
      }
    });
  }
  saveSmartReminders();
  updateSmartReminderBadge();
  return suggestions;
}
function suggestTimeShift(currentTime){
  const [h,m] = currentTime.split(":").map(Number);
  let newH = h, newM = m + 30;
  if(newM >= 60){ newH = (newH + 1) % 24; newM -= 60; }
  return `${pad2(newH)}:${pad2(newM)}`;
}
function applySmartReminder(reminderId){
  const r = smartReminders.find(x => x.id === reminderId);
  if(!r) return;
  const item = (routine[r.dayIdx]||[]).find(x => x.id === r.routineId);
  if(!item){ toast("রুটিন পাওয়া যায়নি","err"); return; }
  item.time = r.suggestedTime;
  routine[r.dayIdx].sort((a,b) => a.time.localeCompare(b.time));
  saveRoutine();
  r.status = "applied";
  saveSmartReminders();
  updateSmartReminderBadge();
  renderView();
  toast(`সময় ${r.currentTime} → ${r.suggestedTime}`,"ok","⏰");
}
window.applySmartReminder = applySmartReminder;

function getWeekKey(date = new Date()){
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d.setDate(diff));
  return monday.toISOString().slice(0,10);
}

function generateWeeklySummary(){
  const weekKey = getWeekKey();
  const weekStart = new Date(weekKey);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate() + 6);

  let totalScheduled = 0, totalStarted = 0, totalSnoozed = 0, totalSkipped = 0;
  let bestDay = { name: "", rate: -1 };
  let worstDay = { name: "", rate: 101 };
  const dailyData = [];

  for(let i = 0; i < 7; i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0,10);
    const dayIdx = d.getDay();
    const items = (routine[dayIdx]||[]).filter(r => r.enabled);
    const dc = checkins[key] || {};
    let started = 0, snoozed = 0, skipped = 0;
    items.forEach(r => {
      const c = dc[r.id];
      if(!c) return;
      if(c.status === "started") started++;
      else if(c.status === "snoozed") snoozed++;
      else if(c.status === "skipped") skipped++;
    });
    totalScheduled += items.length;
    totalStarted += started;
    totalSnoozed += snoozed;
    totalSkipped += skipped;
    const rate = items.length > 0 ? Math.round((started / items.length) * 100) : 0;
    dailyData.push({ day: DAYS_SHORT[dayIdx], date: key, rate, started, total: items.length });
    if(items.length >= 2){
      if(rate > bestDay.rate){ bestDay = { name: DAYS[dayIdx], rate }; }
      if(rate < worstDay.rate){ worstDay = { name: DAYS[dayIdx], rate }; }
    }
  }

  const weekRate = totalScheduled > 0 ? Math.round((totalStarted / totalScheduled) * 100) : 0;
  const discipline = getDisciplineStats();
  const sleepStats = getSleepStats(7);
  const waterStats = getWaterStats(7);
  const unlockedBadges = getUnlockedBadges();

  let advice = "", adviceEmoji = "💡";
  if(weekRate >= 80){ advice = "অসাধারণ সপ্তাহ! প্রতিশ্রুতি রেখেছেন।"; adviceEmoji = "🏆"; }
  else if(weekRate >= 60){ advice = "ভালো সপ্তাহ। কিছু কাজ miss — পরের সপ্তাহে মনোযোগ দিন।"; adviceEmoji = "⭐"; }
  else if(weekRate >= 40){ advice = "মাঝারি সপ্তাহ। চেক-ইনে দ্রুত সাড়া দিন।"; adviceEmoji = "🌱"; }
  else { advice = "এই সপ্তাহটা কঠিন ছিল। ছোট রুটিন দিয়ে শুরু করুন।"; adviceEmoji = "🎯"; }

  const summary = {
    weekKey,
    weekStart: weekStart.toISOString().slice(0,10),
    weekEnd: weekEnd.toISOString().slice(0,10),
    totalScheduled, totalStarted, totalSnoozed, totalSkipped, weekRate,
    bestDay, worstDay, dailyData, discipline,
    sleepAvg: sleepStats.avgHours, waterAvg: waterStats.avg,
    badgesCount: unlockedBadges.length, advice, adviceEmoji, generatedAt: Date.now()
  };

  const idx = weeklySummaries.findIndex(s => s.weekKey === weekKey);
  if(idx >= 0) weeklySummaries[idx] = summary;
  else weeklySummaries.unshift(summary);
  if(weeklySummaries.length > 12) weeklySummaries.length = 12;

  saveWeeklySummaries();
  return summary;
}

  const now = new Date();
  if(now.getDay() !== 5 || now.getHours() < 18) return;
  const weekKey = getWeekKey();

  if(lastShown === todayK) return;

   DISCIPLINE / HABITS / SLEEP / WATER / JOURNAL
   ========================================================= */
function getWeekCheckins(daysBack=7){
  const all = {}; const today = new Date();
  for(let i=0;i<daysBack;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    if(checkins[key]) all[key] = checkins[key];
  }
  return all;
}
function getDisciplineStats(){
  const week = getWeekCheckins(7);
  let total=0,started=0,snoozed=0,skipped=0,totalResponseMs=0,responseCount=0;
  const today = new Date();
  for(let i=0;i<7;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const dayIdx = d.getDay();
    const items = (routine[dayIdx]||[]).filter(r=>r.enabled);
    total += items.length;
    const dc = week[key]||{};
    items.forEach(r=>{
      const c = dc[r.id]; if(!c) return;
      if(c.status==="started") started++;
      else if(c.status==="snoozed") snoozed++;
      else if(c.status==="skipped") skipped++;
      if(c.responseMs && c.responseMs<300000){ totalResponseMs+=c.responseMs; responseCount++; }
    });
  }
  const cr = total>0?(started/total):0;
  const avgMs = responseCount>0?totalResponseMs/responseCount:120000;
  const ss = Math.max(0,Math.min(1,1-(avgMs/300000)*0.7));
  const streak = getDisciplineStreak();
  const strS = Math.min(1,streak/14);
  const volS = Math.min(1,total/30);
  const score = Math.round(cr*50 + ss*20 + strS*20 + volS*10);
  return { score:Math.max(0,Math.min(100,score)), total, started, snoozed, skipped,
    confirmationRate:Math.round(cr*100), avgResponseSec:Math.round(avgMs/1000), streak };
}
function getDisciplineStreak(){
  let streak = 0; const today = new Date();
  for(let i=0;i<365;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const dayIdx = d.getDay();
    const items = (routine[dayIdx]||[]).filter(r=>r.enabled);
    if(items.length===0){ if(i===0) continue; break; }
    const dc = checkins[key]||{};
    const started = items.filter(r=>dc[r.id]?.status==="started").length;
    if(started/items.length>=0.6) streak++;
    else if(i>0) break;
  }
  return streak;
}
function getDisciplineLevel(score){
  if(score>=90) return {name:"মাস্টার",icon:"👑",msg:"আপনি অভূতপূর্ব!"};
  if(score>=75) return {name:"সুশৃঙ্খল",icon:"🏆",msg:"খুব ভালো!"};
  if(score>=60) return {name:"নিয়মিত",icon:"⭐",msg:"ভালো চলছে।"};
  if(score>=40) return {name:"শিক্ষানবিস",icon:"🌱",msg:"চেক-ইন বাড়ান।"};
  return {name:"নতুন শুরু",icon:"🎯",msg:"আজ থেকেই শুরু করুন।"};
}

/* CHECK-IN */
function openCheckin(item,dayIdx){
  if(!settings.checkinEnabled){
    playAlertSound();
    setTimeout(()=>speak(item.text),800);
    showSystemNotification("⏰ "+item.text,`${DAYS[dayIdx]} · ${item.time}`);
    return;
  }
  activeCheckin = { routineId:item.id, item, dayIdx, openedAt:Date.now() };
  $("ciIcon").textContent = "⏰";
  $("ciTitle").textContent = "সময় হয়েছে!";
  $("ciSub").textContent = "আপনি কি এখন কাজ শুরু করছেন?";
  $("ciTime").textContent = `${item.time} · ${DAYS[dayIdx]}`;
  $("ciText").textContent = item.text;
  $("checkinOverlay").classList.add("show");
  playAlertSound();
  setTimeout(()=>speak(`সময় হয়েছে। ${item.text}। শুরু করছেন?`),900);
  showSystemNotification("⏰ "+item.text,`কনফার্ম করুন — ${item.time}`);
  clearTimeout(checkinTimer);
  const autoMs = (settings.autoSkipMinutes||2)*60000;
  checkinTimer = setTimeout(()=>{ if(activeCheckin) autoSkipCheckin(); },autoMs);
  updateCheckinTimer(autoMs);
}
function updateCheckinTimer(ms){
  const el = $("ciTimer"); if(!el) return;
  let left = Math.floor(ms/1000);
  const interval = setInterval(()=>{
    if(!activeCheckin){ clearInterval(interval); return; }
    left--;
    if(left<=0){ clearInterval(interval); return; }
    const m = Math.floor(left/60), s = left%60;
    el.textContent = `কনফার্ম না করলে ${m}:${pad2(s)} পরে auto-skip`;
  },1000);
}
function recordCheckin(routineId,status){
  const key = todayKey();
  if(!checkins[key]) checkins[key] = {};
  const responseMs = activeCheckin?(Date.now()-activeCheckin.openedAt):0;
  checkins[key][routineId] = { status, timestamp:Date.now(), responseMs };
  if(!history[key]) history[key] = {};
  history[key][routineId] = status==="started"?"done":status==="snoozed"?"pending":"skipped";
  saveCheckins(); saveHistory();
}
function closeCheckin(){ activeCheckin = null; clearTimeout(checkinTimer); $("checkinOverlay").classList.remove("show"); }
function startCheckin(){
  if(!activeCheckin) return;
  recordCheckin(activeCheckin.routineId,"started");
  playSuccessSound();
  speak("দুর্দান্ত! শুভকামনা।");
  const stats = getDisciplineStats();
  const level = getDisciplineLevel(stats.score);
  toast(`✅ শুরু! স্কোর: ${stats.score} · ${level.icon} ${level.name}`,"ok","🎯");
  closeCheckin();
  if(currentView==="dashboard"||currentView==="discipline") setTimeout(renderView,300);
}
function snoozeCheckin(){
  if(!activeCheckin) return;
  recordCheckin(activeCheckin.routineId,"snoozed");
  snoozeUntil[activeCheckin.routineId] = Date.now()+10*60000;
  toast("১০ মিনিট পরে","info","⏱️");
  closeCheckin();
}
function skipCheckin(){
  if(!activeCheckin) return;
  recordCheckin(activeCheckin.routineId,"skipped");
  toast("কাজটি বাদ","info","⏭️");
  closeCheckin();
}
function autoSkipCheckin(){
  if(!activeCheckin) return;
  recordCheckin(activeCheckin.routineId,"skipped");
  toast("সময় শেষ — auto-skip","err","⏰");
  closeCheckin();
}
window.startCheckin = startCheckin;
window.snoozeCheckin = snoozeCheckin;
window.skipCheckin = skipCheckin;

function addRoutineItem(dayIndex){
  const modal = $("modal");
  modal.innerHTML = `
    <h2>➕ ${DAYS[dayIndex]}</h2>
    <div class="field"><label>সময়</label><input type="time" id="rTime" value="09:00" required></div>

      <button class="btn-secondary" onclick="closeModal()">বাতিল</button>
      <button class="btn-primary" id="rSaveBtn">যোগ করুন</button>
    </div>`;
  $("modalBackdrop").classList.add("show");
  setTimeout(()=>$("rText").focus(),100);
  $("rSaveBtn").onclick = () => {
    const time = $("rTime").value, text = $("rText").value.trim();
    if(!time||!text){ toast("সময় ও নাম দিন","err"); return; }
    if(!routine[dayIndex]) routine[dayIndex] = [];
    routine[dayIndex].push({
      id:"r_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      time,text,enabled:true,createdAt:new Date().toISOString()
    });
    routine[dayIndex].sort((a,b)=>a.time.localeCompare(b.time));
    saveRoutine(); renderView(); closeModal();
    toast("রুটিন যোগ","ok","✅");
  };
}
function deleteRoutineItem(dayIndex,id){
  if(!routine[dayIndex]) return;
  routine[dayIndex] = routine[dayIndex].filter(r=>r.id!==id);
  saveRoutine(); renderView();
  toast("মুছে ফেলা","info","🗑️");
}
function toggleRoutineItem(dayIndex,id){
  const item = (routine[dayIndex]||[]).find(r=>r.id===id);
  if(!item) return;
  item.enabled = !item.enabled;
  saveRoutine(); renderView();
}
window.addRoutineItem = addRoutineItem;
window.deleteRoutineItem = deleteRoutineItem;
window.toggleRoutineItem = toggleRoutineItem;

function applyTemplate(key){

  modal.innerHTML = `
    <h2>${t.icon} ${t.name}</h2>
    <p>${t.desc}</p>
    <div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:14px;font-size:.8rem;color:var(--sub);">
      <b>${Object.values(t.data).reduce((s,a)=>s+a.length,0)}টি রুটিন</b> যোগ হবে।
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">বাতিল</button>
      <button class="btn-secondary" id="replaceTpl" style="background:var(--danger);color:#fff;border-color:transparent;">প্রতিস্থাপন</button>
      <button class="btn-primary" id="mergeTpl">যোগ করুন</button>
    </div>`;
  $("modalBackdrop").classList.add("show");
  $("mergeTpl").onclick = () => {
    localStorage.setItem("aa_has_template","true");
    for(const d in t.data){
      const i = parseInt(d);
      if(!routine[i]) routine[i] = [];
      t.data[d].forEach(item=>{
        routine[i].push({
          id:"r_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
          time:item.time,text:item.text,enabled:true,template:key,
          createdAt:new Date().toISOString()
        });
      });
      routine[i].sort((a,b)=>a.time.localeCompare(b.time));
    }
    saveRoutine(); renderView(); closeModal();
    toast(`${t.name} যোগ`,"ok",t.icon);
  };
  $("replaceTpl").onclick = () => {
    if(!confirm("বর্তমান সব রুটিন মুছে যাবে। নিশ্চিত?")) return;
    localStorage.setItem("aa_has_template","true");
    routine = {};
    for(const d in t.data){
      const i = parseInt(d);
      routine[i] = t.data[d].map(item=>({
        id:"r_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
        time:item.time,text:item.text,enabled:true,template:key,
        createdAt:new Date().toISOString()
      }));
    }
    saveRoutine(); renderView(); closeModal();
    toast(`${t.name} লোড`,"ok",t.icon);
  };
}

/* ICS */
function escapeICS(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function icsTS(){ const d = new Date(); return `${d.getUTCFullYear()}${pad2(d.getUTCMonth()+1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}${pad2(d.getUTCSeconds())}Z`; }
function routineToVEvent(item,dayIdx){
  const [h,m] = item.time.split(":").map(Number);
  const today = new Date(); today.setHours(0,0,0,0);
  const offset = (dayIdx-today.getDay()+7)%7;
  const start = new Date(today); start.setDate(start.getDate()+offset); start.setHours(h,m,0,0);
  const end = new Date(start.getTime()+30*60000);
  const fmt = d => `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
  return [
    "BEGIN:VEVENT",
    `UID:routine-${dayIdx}-${item.id}@admin-agent.local`,
    `DTSTAMP:${icsTS()}`, `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
    `RRULE:FREQ=WEEKLY;BYDAY=${ICS_DAY[dayIdx]};COUNT=520`,
    `SUMMARY:${escapeICS(item.text)}`, `DESCRIPTION:${escapeICS("Admin Agent · "+item.time)}`,
    "STATUS:CONFIRMED",
    "BEGIN:VALARM","TRIGGER:-PT10M","ACTION:DISPLAY",`DESCRIPTION:${escapeICS("আসছে: "+item.text)}`,"END:VALARM",
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY",`DESCRIPTION:${escapeICS(item.text)}`,"END:VALARM",
    "END:VEVENT"
  ].join("\r\n");
}
function buildWeeklyICS(){
  const lines = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Admin Agent AI//Weekly//BN",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Admin Agent সাপ্তাহিক রুটিন",
    "X-WR-TIMEZONE:"+(Intl.DateTimeFormat().resolvedOptions().timeZone||"Asia/Dhaka")
  ];
  for(let d=0;d<7;d++){
    (routine[d]||[]).filter(r=>r.enabled).forEach(item=>lines.push(routineToVEvent(item,d)));
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadFile(name,content,mime){
  const blob = new Blob([content],{type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);
}

function simpleHash(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    hash = ((hash<<5)-hash)+ch;
    hash = hash & hash;
  }
  return Math.abs(hash).toString(36);
}
function importFromCalendar(){
  const inp = $("importICSFile");
  inp.value = "";
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => parseICS(reader.result);
    reader.readAsText(f);
  };
  inp.click();
}
window.importFromCalendar = importFromCalendar;
function parseICS(text){
  const events = [];
  const blocks = text.split("BEGIN:VEVENT");
  for(let i=1;i<blocks.length;i++){
    const block = blocks[i].split("END:VEVENT")[0];
    const get = key => {
      const re = new RegExp("^"+key+"[^:]*:(.*)$","mi");
      const m = block.match(re); return m ? m[1].trim() : "";
    };
    const summary = get("SUMMARY").replace(/\\,/g,",").replace(/\\;/g,";").replace(/\\n/g,"\n");
    const uid = get("UID") || "";
    const dtStart = get("DTSTART");
    const rrule = get("RRULE");
    if(!summary) continue;
    let deadline = "";
    if(dtStart){
      const iso = dtStart.slice(0,8);
      if(iso.length === 8) deadline = `${iso.slice(0,4)}-${iso.slice(4,6)}-${iso.slice(6,8)}`;
    }
    const contentKey = `${uid}|${summary}|${deadline}|${rrule}`.toLowerCase();
    events.push({ summary, deadline, uid, contentHash:simpleHash(contentKey) });
  }
  if(events.length === 0){ toast("ইভেন্ট নেই","err"); return; }
  const existingUids = new Set();
  const existingHashes = new Set();
  const existingTextDeadline = new Set();
  tasks.forEach(t => {
    if(t.calendarUid) existingUids.add(t.calendarUid);
    if(t.calendarHash) existingHashes.add(t.calendarHash);
    if(t.fromCalendar) existingTextDeadline.add(`${t.text.toLowerCase()}|${t.deadline||""}`);
  });
  let added = 0, skipped = 0;
  events.forEach(ev => {
    if(ev.uid && existingUids.has(ev.uid)){ skipped++; return; }
    if(existingHashes.has(ev.contentHash)){ skipped++; return; }
    if(existingTextDeadline.has(`${ev.summary.toLowerCase()}|${ev.deadline||""}`)){ skipped++; return; }
    tasks.push({
      id:"cal_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
      text:ev.summary, category:"This Week", priority:"Medium",
      deadline:ev.deadline, fromCalendar:true,
      calendarUid:ev.uid, calendarHash:ev.contentHash,
      createdAt:new Date().toISOString()
    });
    if(ev.uid) existingUids.add(ev.uid);
    existingHashes.add(ev.contentHash);
    existingTextDeadline.add(`${ev.summary.toLowerCase()}|${ev.deadline||""}`);
    added++;
  });
  saveTasks(); renderView();
  if(added === 0 && skipped > 0) toast(`সব ${skipped}টি আগেই আছে ✓`,"info","✨");
  else if(added > 0 && skipped > 0) toast(`${added}টি নতুন · ${skipped}টি আগেই`,"ok","🔁");
  else toast(`${added}টি ইভেন্ট যোগ`,"ok","🔁");
}
window.removeCalendarDuplicates = function(){
  const seen = new Set(), duplicates = [];
  tasks.forEach(t => {
    if(!t.fromCalendar) return;
    const key = t.calendarUid ? "uid:"+t.calendarUid : t.calendarHash ? "hash:"+t.calendarHash : "td:"+(t.text+"|"+(t.deadline||"")).toLowerCase();
    if(seen.has(key)) duplicates.push(t.id);
    else seen.add(key);
  });
  if(duplicates.length === 0){ toast("ডুপ্লিকেট নেই ✓","ok","✨"); return; }
  if(!confirm(`${duplicates.length}টি সরাবেন?`)) return;
  tasks = tasks.filter(t => !duplicates.includes(t.id));
  saveTasks(); renderView();
  toast(`${duplicates.length}টি সরানো`,"ok","🧹");
};

function shareViaWhatsApp(){
  const text = buildRoutineText();
  if(!text){ toast("প্রথমে রুটিন যোগ করুন","err"); return; }
  const encoded = encodeURIComponent(text);
  const waMobile = "https://wa.me/?text=" + encoded;
  const waDesktop = "https://api.whatsapp.com/send?text=" + encoded;
  if(navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){
    navigator.share({ title:"আমার সাপ্তাহিক রুটিন", text })
      .then(() => { addShareHistory("whatsapp","native"); toast("শেয়ার","ok","📤"); })
      .catch(err => {
        if(err.name === "AbortError") return;
        copyToClipboard(text, "কপি — WhatsApp-এ paste");
        setTimeout(() => openUrl(waMobile), 600);
      });
    return;
  }
  copyToClipboard(text, "কপি — WhatsApp-এ paste");
  setTimeout(() => openUrl(waDesktop), 500);
}
window.shareViaWhatsApp = shareViaWhatsApp;

function deleteHabit(id){
  if(!confirm("হ্যাবিটটি মুছবেন?")) return;
  habits = habits.filter(h=>h.id!==id);
  Object.keys(habitLog).forEach(date=>{ delete habitLog[date][id]; });
  saveHabits(); saveHabitLog(); renderView();
  toast("মুছে ফেলা","info","🗑️");
}
window.deleteHabit = deleteHabit;
function toggleHabitToday(habitId){
  const key = todayKey();
  if(!habitLog[key]) habitLog[key] = {};
  if(habitLog[key][habitId]) delete habitLog[key][habitId];
  else { habitLog[key][habitId] = true; playSuccessSound(); }
  saveHabitLog(); renderView();
}
window.toggleHabitToday = toggleHabitToday;
function getHabitStreak(habitId){
  let streak = 0; const today = new Date();
  for(let i=0;i<365;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    if(habitLog[key] && habitLog[key][habitId]) streak++;
    else if(i===0) continue;
    else break;
  }
  return streak;
}
function getHabitTotalDays(habitId){
  let count = 0;
  Object.keys(habitLog).forEach(date=>{ if(habitLog[date][habitId]) count++; });
  return count;
}
function getHabitCompletionRate(habitId,days=30){
  let total = 0, done = 0;
  const today = new Date();
  for(let i=0;i<days;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    total++;
    const key = d.toISOString().slice(0,10);
    if(habitLog[key] && habitLog[key][habitId]) done++;
  }
  return total>0?Math.round((done/total)*100):0;
}
function renderHabits(){
  let html = `<h2 class="section-title">🎯 হ্যাবিট ট্র্যাকার</h2>`;
  if(habits.length === 0){
    html += `<div class="card" style="text-align:center;padding:40px 20px;">
      <div style="font-size:3rem;margin-bottom:12px;">🎯</div>
      <div style="font-weight:700;margin-bottom:8px;">কোনো হ্যাবিট নেই</div>
      <button class="btn-primary" onclick="addHabit()">+ নতুন হ্যাবিট</button>
    </div>`;
    return html;
  }
  html += `<div style="margin-bottom:16px;"><button class="btn-primary" onclick="addHabit()">+ নতুন হ্যাবিট</button></div><div class="habit-grid">`;
  habits.forEach(h=>{
    const key = todayKey();
    const doneToday = habitLog[key] && habitLog[key][h.id];
    const streak = getHabitStreak(h.id);
    const total = getHabitTotalDays(h.id);
    const rate = getHabitCompletionRate(h.id,30);
    const progress = Math.min(100,Math.round((streak/h.goal)*100));
    const week = [];
    const today = new Date();
    for(let i=6;i>=0;i--){
      const d = new Date(today); d.setDate(d.getDate()-i);
      const k = d.toISOString().slice(0,10);
      week.push({ day:DAYS_SHORT[d.getDay()], done: habitLog[k] && habitLog[k][h.id] });
    }
    html += `<div class="card">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;">
        <div style="font-size:2.2rem;flex-shrink:0;">${h.icon}</div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:1rem;">${escapeHtml(h.name)}</div>
          <div style="font-size:.72rem;color:var(--sub);margin-top:2px;">${streak}🔥 · ${total} দিন · ${rate}%</div>
        </div>
        <button class="btn-ghost" onclick="deleteHabit('${h.id}')" style="padding:4px 8px;">🗑️</button>
      </div>
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:4px;color:var(--sub);">
          <span>লক্ষ্য: ${h.goal} দিন</span><span>${progress}%</span>
        </div>
        <div style="height:10px;background:var(--bg);border-radius:6px;overflow:hidden;">
          <div style="height:100%;width:${progress}%;background:linear-gradient(90deg,var(--ok),#5fa585);border-radius:6px;"></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;">
        ${week.map(w=>`
          <div style="text-align:center;">
            <div style="font-size:.62rem;color:var(--sub);margin-bottom:3px;">${w.day}</div>
            <div style="aspect-ratio:1;background:${w.done?'var(--ok)':'var(--bg)'};border:1px solid ${w.done?'var(--ok)':'var(--line)'};border-radius:8px;display:grid;place-items:center;color:${w.done?'#fff':'var(--sub)'};font-size:.85rem;">${w.done?'✓':''}</div>
          </div>
        `).join("")}
      </div>
      <button class="${doneToday?'btn-ok':'btn-primary'}" style="width:100%;padding:12px;" onclick="toggleHabitToday('${h.id}')">
        ${doneToday?'✅ আজ সম্পন্ন — আনডু':'✓ আজ সম্পন্ন'}
      </button>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function logSleep(){
  const modal = $("modal");
  const today = todayKey();
  const existing = sleepLog[today] || {};
  modal.innerHTML = `
    <h2>🌙 ঘুম লগ</h2>
    <div class="field-row">
      <div class="field"><label>ঘুমাতে গিয়েছিলাম</label><input type="time" id="sleepBed" value="${existing.bed || "23:00"}"></div>
      <div class="field"><label>ঘুম থেকে উঠেছি</label><input type="time" id="sleepWake" value="${existing.wake || "07:00"}"></div>
    </div>
    <div class="field"><label>গুণমান</label>
      <select id="sleepQuality">
        <option value="excellent" ${existing.quality==="excellent"?"selected":""}>🌟 চমৎকার</option>
        <option value="good" ${existing.quality==="good"||!existing.quality?"selected":""}>😊 ভালো</option>
        <option value="ok" ${existing.quality==="ok"?"selected":""}>😐 ঠিক আছে</option>
        <option value="poor" ${existing.quality==="poor"?"selected":""}>😴 খারাপ</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">বাতিল</button>
      ${existing.bed ? '<button class="btn-danger" id="sleepDelete">মুছুন</button>' : ''}
      <button class="btn-primary" id="sleepSave">সেভ</button>
    </div>`;
  $("modalBackdrop").classList.add("show");
  $("sleepSave").onclick = () => {
    const bed = $("sleepBed").value, wake = $("sleepWake").value, quality = $("sleepQuality").value;
    if(!bed || !wake){ toast("সময় দিন","err"); return; }
    const [bh,bm] = bed.split(":").map(Number);
    const [wh,wm] = wake.split(":").map(Number);
    let bedMin = bh*60+bm, wakeMin = wh*60+wm;
    if(wakeMin <= bedMin) wakeMin += 24*60;
    const hours = +((wakeMin - bedMin) / 60).toFixed(1);
    sleepLog[today] = { bed, wake, hours, quality, loggedAt: Date.now() };
    saveSleep(); closeModal(); renderView();
    toast(`${hours} ঘণ্টা লগ`,"ok","🌙");
  };
  const del = $("sleepDelete");
  if(del) del.onclick = () => {
    delete sleepLog[today]; saveSleep(); closeModal(); renderView();
    toast("মুছে ফেলা","info","🗑️");
  };
}
window.logSleep = logSleep;

function getSleepStats(days=7){
  let totalHours = 0, count = 0, best = 0, worst = 24;
  const today = new Date();
  const data = [];
  for(let i=0;i<days;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const entry = sleepLog[key];
    if(entry){
      totalHours += entry.hours; count++;
      if(entry.hours > best) best = entry.hours;
      if(entry.hours < worst) worst = entry.hours;
      data.push({ key, day: DAYS_SHORT[d.getDay()], hours: entry.hours, quality: entry.quality });
    } else {
      data.push({ key, day: DAYS_SHORT[d.getDay()], hours: 0, missing: true });
    }
  }
  return {
    avgHours: count>0 ? +(totalHours/count).toFixed(1) : 0,
    totalDays: count, best, worst: count>0?worst:0,
    data: data.reverse()
  };
}
function getSleepEmoji(hours){
  if(hours >= 8) return "😴";
  if(hours >= 7) return "😊";
  if(hours >= 6) return "😐";
  if(hours >= 5) return "😪";
  return "🥱";
}
function getQualityLabel(q){
  return { excellent:"🌟 চমৎকার", good:"😊 ভালো", ok:"😐 ঠিক আছে", poor:"😴 খারাপ" }[q] || "";
}
function getSleepAdvice(avg, days){
  if(days === 0) return "এখনো ডেটা নেই। আজ রাত থেকেই শুরু করুন।";
  if(avg < 5) return "⚠️ খুব কম ঘুমাচ্ছেন। ৭-৮ ঘণ্টা লক্ষ্য রাখুন।";
  if(avg < 6.5) return "ঘুম কিছুটা কম। ৩০ মিনিট আগে ঘুমান।";
  if(avg < 7.5) return "✅ প্রায় স্বাভাবিক। ৭-৮ ঘণ্টায় পৌঁছান।";
  if(avg <= 9) return "🌟 দুর্দান্ত! স্বাস্থ্যকর ঘুম।";
  return "💤 বেশি ঘুমাচ্ছেন। ৯ ঘণ্টার কম রাখুন।";
}

    <div class="card" style="background:linear-gradient(135deg,#2a3d5c,#1a2b45);color:#fff;border:none;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">

          <div style="font-size:.85rem;opacity:.9;">লক্ষ্য: ${target} ঘণ্টা · ${pct}%</div>

      <div class="stat ok"><div class="label">গড় ঘুম</div><div class="value">${stats.avgHours}h</div><div class="delta">শেষ ৭ দিন</div></div>
      <div class="stat high"><div class="label">সর্বোচ্চ</div><div class="value">${stats.best}h</div><div class="delta">একদিনে</div></div>
    </div>
    <div class="card">

      <div style="display:flex;align-items:flex-end;gap:6px;height:140px;padding:10px 0;">
        ${stats.data.map(d => {
          const h = (d.hours / maxChart) * 100;

/* WATER */
function addWater(){
  const key = todayKey();
  const cur = waterLog[key] || 0;
  if(cur >= 20){ toast("২০ গ্লাসের বেশি নয়!","err","💧"); return; }
  waterLog[key] = cur + 1;
  saveWater(); renderView();
  playBeep(0.1, 1200, 1500);
  toast(`${waterLog[key]} গ্লাস!`,"ok","💧");
}
function removeWater(){
  const key = todayKey();
  const cur = waterLog[key] || 0;
  if(cur <= 0) return;
  waterLog[key] = cur - 1;
  saveWater(); renderView();
}
window.addWater = addWater;
window.removeWater = removeWater;
function getWaterStats(days=7){
  const target = 8;
  let totalGlasses = 0, count = 0, daysHitGoal = 0;
  const data = [];
  const today = new Date();
  for(let i=0;i<days;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const g = waterLog[key] || 0;
    totalGlasses += g;
    if(g > 0) count++;
    if(g >= target) daysHitGoal++;
    data.push({ key, day: DAYS_SHORT[d.getDay()], glasses: g, hit: g >= target });
  }
  return {
    avg: count>0 ? (totalGlasses/count).toFixed(1) : 0,
    total: totalGlasses, hitGoal: daysHitGoal, data: data.reverse()
  };
}
function getWaterAdvice(avg){
  if(avg < 3) return "⚠️ খুব কম পানি। সকালে উঠেই ১ গ্লাস।";
  if(avg < 6) return "কিছুটা কম। বোতল পাশে রাখুন।";
  if(avg < 8) return "✅ ভালো! আরও ১-২ গ্লাস।";
  return "🌟 দুর্দান্ত! পর্যাপ্ত পানি।";
}

  const count = waterLog[today] || 0;

      <div style="font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;opacity:.9;">আজকের পানি</div>
      <div style="font-size:3.5rem;font-weight:800;line-height:1;margin:8px 0;">${count}<span style="font-size:1.2rem;opacity:.7;">/${target} গ্লাস</span></div>
      <div style="height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin:12px auto;max-width:300px;">

    </div>
    <div class="card">
      <h3>💧 আজ কত গ্লাস পান?</h3>
      <div style="display:flex;gap:8px;justify-content:center;margin:16px 0;">

      </div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">

function uploadCustomSound(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "audio/*";
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 500*1024){ toast("ফাইল ৫০০KB এর বেশি","err"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      customSoundData = { name: file.name, type: file.type, dataUrl: reader.result, uploadedAt: Date.now() };
      saveCustomSound(); renderView();
      toast("সাউন্ড আপলোড","ok","🎵");
      setTimeout(() => playAlertSound(), 300);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
window.uploadCustomSound = uploadCustomSound;
function removeCustomSound(){

function uploadCustomRecord(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("রেকর্ড সাপোর্ট নেই","err"); return;
  }
  const modal = $("modal");
  modal.innerHTML = `
    <h2>🎤 ভয়েস রেকর্ড</h2>
    <p>২-১০ সেকেন্ডের সাউন্ড।</p>
    <div style="text-align:center;padding:20px;">
      <div id="recStatus" style="font-size:1.2rem;font-weight:700;margin-bottom:12px;">🎙️ প্রস্তুত</div>
      <div id="recTimer" style="font-size:2rem;font-weight:800;color:var(--accent);margin-bottom:12px;">০০:০০</div>
      <button class="btn-primary" id="recBtn" style="padding:16px 40px;font-size:1rem;">🔴 শুরু</button>
    </div>
    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">বাতিল</button></div>`;
  $("modalBackdrop").classList.add("show");
  let recorder = null, chunks = [], timerInterval = null, seconds = 0;
  $("recBtn").onclick = async () => {
    if(recorder && recorder.state === "recording"){ recorder.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream);
      chunks = []; seconds = 0;
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        clearInterval(timerInterval);
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: "audio/webm" });
        if(blob.size > 500*1024){ toast("বড়","err"); return; }
        const reader = new FileReader();
        reader.onload = () => {
          customSoundData = { name: "রেকর্ডিং", type: blob.type, dataUrl: reader.result, uploadedAt: Date.now() };
          saveCustomSound(); closeModal(); renderView();
          toast("সেভ হয়েছে","ok","🎤");
          setTimeout(() => playAlertSound(), 300);
        };
        reader.readAsDataURL(blob);
      };
      recorder.start();
      $("recBtn").textContent = "⏹️ থামান";
      $("recStatus").textContent = "🔴 রেকর্ডিং...";
      timerInterval = setInterval(() => {
        seconds++;
        const m = Math.floor(seconds/60), s = seconds%60;
        $("recTimer").textContent = `${pad2(m)}:${pad2(s)}`;
        if(seconds >= 10) recorder.stop();
      }, 1000);
    }catch(e){ toast("মাইক অনুমতি দিন","err"); }
  };
}

function getMonthStats(offset=0){
  const today = new Date();
  const target = new Date(today.getFullYear(),today.getMonth()-offset,1);
  const monthEnd = new Date(target.getFullYear(),target.getMonth()+1,0);
  let totalScheduled=0,totalStarted=0,totalSnoozed=0,totalSkipped=0,activeDays=0;
  const dailyData = [];
  for(let d=1;d<=monthEnd.getDate();d++){
    const date = new Date(target.getFullYear(),target.getMonth(),d);
    if(date > today) break;
    const key = date.toISOString().slice(0,10);
    const dayIdx = date.getDay();
    const items = (routine[dayIdx]||[]).filter(r=>r.enabled);
    totalScheduled += items.length;
    const dc = checkins[key] || {};
    let dayStarted = 0;
    items.forEach(r=>{
      const c = dc[r.id]; if(!c) return;
      if(c.status==="started"){ totalStarted++; dayStarted++; }
      else if(c.status==="snoozed") totalSnoozed++;
      else if(c.status==="skipped") totalSkipped++;
    });
    if(dayStarted>0) activeDays++;
    dailyData.push({ date:key, day:d, started:dayStarted, total:items.length });
  }
  const monthName = target.toLocaleDateString("bn-BD",{month:"long",year:"numeric"});
  const rate = totalScheduled>0?Math.round((totalStarted/totalScheduled)*100):0;
  return { name:monthName, year:target.getFullYear(), month:target.getMonth(),
    totalScheduled, totalStarted, totalSnoozed, totalSkipped, activeDays, rate, dailyData };
}

function getUnlockedBadges(){
  const stats = getDisciplineStats();
  let maxHabitStreak = 0;
  habits.forEach(h => { const s = getHabitStreak(h.id); if(s > maxHabitStreak) maxHabitStreak = s; });
  let hasPerfectDay = false;
  Object.keys(checkins).forEach(date => {
    const d = new Date(date);
    const dayIdx = d.getDay();
    const items = (routine[dayIdx]||[]).filter(r=>r.enabled);
    if(items.length === 0) return;
    const dc = checkins[date];
    const started = items.filter(r => dc[r.id]?.status === "started").length;
    if(started === items.length && items.length >= 3) hasPerfectDay = true;
  });
  let goodSleepDays = 0;
  const today = new Date();
  for(let i=0;i<7;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const entry = sleepLog[d.toISOString().slice(0,10)];
    if(entry && entry.hours >= 7) goodSleepDays++;
  }
  const ctx = {
    stats, maxHabitStreak, hasPerfectDay, goodSleepDays,
    waterStats: getWaterStats(7),
    journalCount: journalEntries.length,
    cloudEnabled: syncEnabled && fbUser !== null,
    hasShared: localStorage.getItem("aa_has_shared") === "true",
    hasTemplate: localStorage.getItem("aa_has_template") === "true"
  };
  return BADGES.filter(b => { try{ return b.check(ctx); }catch(e){ return false; } });
}

window.quickAddToGoogleCalendar = function(dayIdx,routineId){
  const item = (routine[dayIdx]||[]).find(r => r.id === routineId);
  if(!item) return;
  const [h,m] = item.time.split(":").map(Number);
  const today = new Date(); today.setHours(0,0,0,0);
  const offset = (dayIdx - today.getDay() + 7) % 7;
  const start = new Date(today); start.setDate(start.getDate()+offset); start.setHours(h,m,0,0);
  const end = new Date(start.getTime()+30*60000);
  const fmt = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  openUrl(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(item.text)}&dates=${fmt(start)}/${fmt(end)}&recur=RRULE:FREQ=WEEKLY;BYDAY=${ICS_DAY[dayIdx]}`);
  toast("Calendar খোলা হচ্ছে","info","📅");
};

function getCategoryStats(){
  const stats = {};
  COLS.forEach(c => stats[c] = 0);
  tasks.forEach(t => { if(stats[t.category]!==undefined) stats[t.category]++; });
  return stats;
}
function getCompletionRate(daysBack=7){
  let scheduled=0,done=0;
  const today = new Date();
  for(let i=0;i<daysBack;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const dayIdx = d.getDay();
    const items = (routine[dayIdx]||[]).filter(r=>r.enabled);
    scheduled += items.length;
    const h = history[key] || {};
    items.forEach(r => { if(h[r.id] === "done") done++; });
  }
  return scheduled>0?Math.round((done/scheduled)*100):0;
}
function getStreak(){
  let streak = 0; const today = new Date();
  for(let i=0;i<365;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const dayIdx = d.getDay();
    const items = (routine[dayIdx]||[]).filter(r=>r.enabled);
    const h = history[key] || {};
    const doneCount = items.filter(r => h[r.id] === "done").length;
    if(items.length>0 && doneCount>0) streak++;
    else if(i>0) break;
  }
  return streak;
}
function getDayLoad(){
  const loads = [];
  for(let d=0;d<7;d++) loads.push((routine[d]||[]).filter(r=>r.enabled).length);
  return loads;
}

function generateInsights(){
  const list = [];

  else if(stats.score<40 && stats.total>0) list.push({ icon:"🎯", title:`স্কোর: ${stats.score}`, text:"দ্রুত সাড়া দিন।" });
  loads.forEach((n,i)=>{
    if(n>avgLoad*1.5 && n>=5) list.push({ icon:"⚖️", title:`${DAYS[i]} ব্যস্ত`, text:`${n}টি কাজ।` });
    if(n===0) list.push({ icon:"💤", title:`${DAYS[i]} ফাঁকা`, text:"রুটিন যোগ করুন।" });
  });
  const rate = getCompletionRate(7);
  if(rate>0 && rate<40) list.push({ icon:"📉", title:"সম্পন্নতা কম", text:`${rate}%` });
  else if(rate>=70) list.push({ icon:"🌟", title:"দুর্দান্ত", text:`${rate}%` });
  const sleepStats = getSleepStats(7);
  if(sleepStats.avgHours < 6 && sleepStats.totalDays >= 2) list.push({ icon:"🌙", title:"ঘুম কম", text:`গড়ে ${sleepStats.avgHours}h। ৭-৮ লক্ষ্য।` });
  const waterStats = getWaterStats(7);
  if(parseFloat(waterStats.avg) < 5 && waterStats.total > 0) list.push({ icon:"💧", title:"পানি কম", text:`গড়ে ${waterStats.avg} গ্লাস।` });

}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(data.routine) routine = data.routine;
      if(Array.isArray(data.tasks)) tasks = data.tasks;
      if(data.settings) settings = Object.assign(settings,data.settings);
      if(data.history) history = data.history;
      if(data.checkins) checkins = data.checkins;
      if(data.insights) insights = data.insights;
      if(data.habits) habits = data.habits;
      if(data.habitLog) habitLog = data.habitLog;
      if(data.sleepLog) sleepLog = data.sleepLog;
      if(data.waterLog) waterLog = data.waterLog;
      if(data.journalEntries) journalEntries = data.journalEntries;
      if(data.smartReminders) smartReminders = data.smartReminders;
      if(data.emailRecipients) emailRecipients = data.emailRecipients;
      if(data.weeklySummaries) weeklySummaries = data.weeklySummaries;
      saveRoutine(); saveTasks(); saveSettings(); saveHistory(); saveCheckins();
      saveInsights(); saveHabits(); saveHabitLog(); saveSleep(); saveWater(); saveJournal();
      saveSmartReminders(); saveEmailRecipients(); saveWeeklySummaries();
      renderView(); updateSleepIndicator(); updateSoundIcon();
      toast("রিস্টোর সফল","ok","⬆");
    }catch(e){ toast("ফাইল পড়া যায়নি","err"); }
  };
  reader.readAsText(file);
}

function checkSchedule(){
  if(isSleepTime()) return;
  const now = new Date();
  const dayIdx = now.getDay();
  const timeNow = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const today = now.toISOString().slice(0,10);
  const items = routine[dayIdx]||[];
  items.forEach(r => {
    if(!r.enabled) return;
    if(r.time !== timeNow) return;
    const key = `${today}_${r.id}_${r.time}`;
    if(lastFired[key]) return;
    if(snoozeUntil[r.id] && Date.now() < snoozeUntil[r.id]) return;
    delete snoozeUntil[r.id];
    lastFired[key] = true;
    openCheckin(r,dayIdx);
  });
  const cutoff = new Date(Date.now()-2*86400000).toISOString().slice(0,10);
  Object.keys(lastFired).forEach(k => { if(k.slice(0,10) < cutoff) delete lastFired[k]; });
}

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  $("pwaInstallBanner").classList.add("show");
});
const installBtn = $("pwaInstallBtn");
if(installBtn) installBtn.addEventListener("click", async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $("pwaInstallBanner").classList.remove("show");
});
const dismissBtn = $("pwaDismissBtn");
if(dismissBtn) dismissBtn.addEventListener("click", () => {
  $("pwaInstallBanner").classList.remove("show");
  localStorage.setItem("pwa_dismissed",Date.now().toString());
});
if(window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone){
  const banner = $("pwaInstallBanner");
  if(banner) banner.style.display = "none";
}

/* INIT */
function init(){
  initTheme();
  loadState();

  document.querySelectorAll(".nav-item[data-view]").forEach(b => {
    b.addEventListener("click",() => switchView(b.dataset.view));
  });
  $("menuBtn").addEventListener("click",openSidebarMobile);
  $("sidebarBackdrop").addEventListener("click",closeSidebarMobile);
  $("themeToggle").addEventListener("click",toggleTheme);
  $("soundToggle").addEventListener("click",() => {
    settings.sound = !settings.sound; saveSettings(); updateSoundIcon();
    toast(settings.sound?"সাউন্ড চালু":"সাউন্ড বন্ধ","info",settings.sound?"🔔":"🔕");
  });
  $("cloudToggle").addEventListener("click",() => {
    switchView("cloud");
  });
  $("modalBackdrop").addEventListener("click", e => { if(e.target.id === "modalBackdrop") closeModal(); });
  $("importFile").addEventListener("change", e => { if(e.target.files[0]) importBackup(e.target.files[0]); });

  $("ciStart").addEventListener("click",startCheckin);
  $("ciSnooze").addEventListener("click",snoozeCheckin);
  $("ciSkip").addEventListener("click",skipCheckin);
  $("wcContinue").addEventListener("click",() => $("welcomeOverlay").classList.remove("show"));

  const firstClick = () => {
    if("Notification" in window && Notification.permission === "default") requestNotifPermission();
    ensureAudio();
    document.removeEventListener("click",firstClick);
  };
  document.addEventListener("click",firstClick,{ once:true });

  renderView();
  updateSoundIcon();
  updateCloudIcon();
  updateSleepIndicator();
  updateCloudIndicator();
  updateSmartReminderBadge();

  setTimeout(showWelcome,1500);
  setInterval(() => { checkSchedule(); updateSleepIndicator(); },20000);
  checkSchedule();
  setInterval(generateInsights,3600000);
  setInterval(checkWeeklySummaryNotification, 60000);
  setTimeout(checkWeeklySummaryNotification, 5000);
  setInterval(updateSmartReminderBadge, 3600000);
  analyzeSmartReminders();

  // Init Firebase if configured
  if(firebaseConfig){
    const tryInit = () => {
      if(window.FirebaseSDK){
        initFirebase();
      } else {
        setTimeout(tryInit, 500);
      }
    };
    tryInit();
  }
  window.addEventListener("firebase-sdk-ready", () => {
    if(firebaseConfig) initFirebase();
  });

  // Voice list loader
  if("speechSynthesis" in window){
    const loadVoices = () => {
      const voices = window.speechSynthesis.getVoices();
      const el = $("voiceList");
      if(!el) return;
      const bnVoices = voices.filter(v => v.lang.startsWith("bn"));
      const enVoices = voices.filter(v => v.lang.startsWith("en")).slice(0, 3);
      let h = "";
      if(bnVoices.length > 0) h += "<b style='color:var(--ok);'>বাংলা:</b><br>" + bnVoices.map(v => "• " + escapeHtml(v.name)).join("<br>");
      else h += "<span style='color:var(--warn);'>⚠️ বাংলা ভয়েস নেই। ডিভাইস সেটিংস থেকে TTS যোগ করুন।</span>";
      h += "<br><br><b>ইংরেজি:</b><br>" + enVoices.map(v => "• " + escapeHtml(v.name)).join("<br>");
      el.innerHTML = h;
    };
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 200);
    setTimeout(loadVoices, 1000);
  }
}

document.addEventListener("DOMContentLoaded",init);
</script>
